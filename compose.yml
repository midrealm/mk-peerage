x-condition-healthy: &healthy
  condition: service_healthy

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 10s
  start_period: 10s
  retries: 5

services:
  web:
    build: 
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "3000:3000"
      - "4000:4000" #for selenium-chrome
    volumes:
      - .:/app
      - gem_cache:/gems
    env_file:
      - .env
      - .env-dev-values
    depends_on:
      database: *healthy
    environment:
      - WEBPACKER_DEV_SERVER_HOST=webpack-dev-server
      - SELENIUM_DRIVER_URL=http://selenium-chrome:4444/wd/hub
      - CAPYBARA_APP_HOST=http://web:4000
  
  webpack-dev-server:
    build: .
    command: ./bin/webpack-dev-server
    ports:
      - 3035:3035
    volumes:
      - .:/app
      - gem_cache:/gems
    env_file:
      - .env-dev-values
      - .env
    environment:
      - WEBPACKER_DEV_SERVER_HOST=0.0.0.0
      - NODE_ENV=development
      - RAILS_ENV=development
      
  selenium-chrome:
    image: selenium/standalone-chrome-debug
    logging:
      driver: none
    ports:
      - "5900:5900"

  database:
    image: postgres
    env_file:
      - .env-dev-values
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "pg_isready"]


volumes:
  db_data:
  gem_cache:
